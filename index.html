<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MSFS Flight Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- ✅ Leaflet CSS -->
  <link 
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" 
    integrity="sha512-p/1JQylV+gC0ZcB1YyFQ9jSzn8pN5YQEiHcP1ElH2eywjp+1DKx6ZczO3jybSXhScMZlZHEpwn9K2RChnLk1BA==" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer"
  />

  <style>
    body { margin: 0; }
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- ✅ Leaflet JS -->
  <script 
    src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" 
    integrity="sha512-vAdOomH5tKwTXttBYmcgx2VwZrMjnZWGOk8Eam9FnOxAaRVF7E2AcwTh5dSS4RkH0C1V8V7xzwX1Y0az4q1i9g==" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer">
  </script>

  <script>
    // Initialize the map centered on Europe
    const map = L.map('map').setView([48.5, 9], 5);

    // Add OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Example airports: Athens LGAV and Amsterdam EHAM
    const LGAV = [37.9364, 23.9445];
    const EHAM = [52.3086, 4.7639];

    // Add pins
    L.marker(LGAV).addTo(map).bindPopup("LGAV - Athens");
    L.marker(EHAM).addTo(map).bindPopup("EHAM - Amsterdam");

    // Draw route line
    L.polyline([LGAV, EHAM], { color: 'red' }).addTo(map);
  </script>
</body>
</html>
