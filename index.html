<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MSFS Flight Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #map { height: 70vh; width: 100%; }
    #flights { padding: 1em; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
    th { background: #eee; }
  </style>
</head>
<body>
  <h2 style="text-align:center;">MSFS Flight Tracker</h2>
  <div id="map"></div>
  <div id="flights">
    <h3>Flight Log</h3>
    <table>
      <thead>
        <tr>
          <th>Date</th><th>From</th><th>To</th><th>Aircraft</th><th>Duration</th>
        </tr>
      </thead>
      <tbody id="flight-rows"></tbody>
    </table>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    async function loadFlights() {
      try {
        const response = await fetch('./flights.json'); // must be in repo root
        if (!response.ok) throw new Error("flights.json not found");
        return await response.json();
      } catch (e) {
        console.error("⚠️ Could not load flights.json:", e);
        // fallback example
        return [
          { date:"2025-09-29", departure:"LGAV", arrival:"EHAM", aircraft:"A320", duration:"3h15m" },
          { date:"2025-09-25", departure:"EHAM", arrival:"EDDF", aircraft:"B738", duration:"1h10m" }
        ];
      }
    }

    async function init() {
      const flights = await loadFlights();

      // Initialize map
      const map = L.map('map').setView([40, 10], 4);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      setTimeout(() => map.invalidateSize(), 500);

      // Add markers + lines
      const flightRows = document.getElementById("flight-rows");
      let lastLatLng = null;

      for (const f of flights) {
        // Dummy geocode for demo (replace with real coords or lookup table)
        const airports = {
          "LGAV": [37.9364, 23.9445],
          "EHAM": [52.3086, 4.7639],
          "EDDF": [50.0379, 8.5622]
        };
        const dep = airports[f.departure];
        const arr = airports[f.arrival];

        if (dep) L.marker(dep).addTo(map).bindPopup(f.departure);
        if (arr) L.marker(arr).addTo(map).bindPopup(f.arrival);
        if (dep && arr) {
          L.polyline([dep, arr], { color: "red" }).addTo(map);
          lastLatLng = arr;
        }

        // Add to table
        flightRows.insertAdjacentHTML("beforeend", `
          <tr>
            <td>${f.date}</td>
            <td>${f.departure}</td>
            <td>${f.arrival}</td>
            <td>${f.aircraft}</td>
            <td>${f.duration}</td>
          </tr>
        `);
      }

      if (lastLatLng) map.setView(lastLatLng, 5);
    }

    init();
  </script>
</body>
</html>
